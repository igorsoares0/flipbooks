# Local Postgres for development and tests. Production uses Neon via DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    container_name: flipbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flipbook
      POSTGRES_PASSWORD: flipbook
      POSTGRES_DB: flipbook
    ports:
      - "5433:5432"
    volumes:
      - flipbook-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipbook -d flipbook"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  flipbook-pgdata:
